services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aimath}
      POSTGRES_USER: ${POSTGRES_USER:-aimath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [sh, -c, 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:-change-me-too}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-too}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-aimath}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-this-s3-password}
      S3_BUCKET: ${S3_BUCKET:-math-lessons}
    ports: ["8333:8333"]
    volumes: [seaweedfs_data:/data]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aimath}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aimath}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-too}
      APP_STORAGE_ENDPOINT: http://seaweedfs:8333
      APP_STORAGE_ACCESS_KEY: ${S3_ACCESS_KEY:-aimath}
      APP_STORAGE_SECRET_KEY: ${S3_SECRET_KEY:-change-this-s3-password}
      APP_STORAGE_BUCKET: ${S3_BUCKET:-math-lessons}
      APP_AI_PROVIDER: ${AI_PROVIDER:-demo}
      APP_AI_API_KEY: ${AI_API_KEY:-}
      APP_AI_BASE_URL: ${AI_BASE_URL:-}
      APP_AI_MODEL: ${AI_MODEL:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_started}
    ports: ["8080:8080"]
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
